api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      additionalPortMappings:
        - targetPort: 9000
          external: false
        - targetPort: 8000
          external: false
      external: false
      targetPort: 8080
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: client-secret
        value: '{{ securedParameter "KeycloakClientSecret" }}'
      - name: kc-bootstrap-admin-password
        value: '{{ securedParameter "keycloak_auth_service_password" }}'
  template:
    volumes:
      - name: keycloak-auth-service-bm0
        storageType: AzureFile
        storageName: {{ .Env.SERVICE_KEYCLOAK_AUTH_SERVICE_VOLUME_BM0_NAME }} 
    containers:
      - image: {{ .Image }}
        name: keycloak-auth-service
        args:
          - start
          - --import-realm
          - --http-enabled=true
          - --hostname=localhost
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: admin
          - name: KC_FEATURES
            value: opentelemetry
          - name: KC_HEALTH_ENABLED
            value: "true"
          - name: CLIENT_SECRET
            secretRef: client-secret
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            secretRef: kc-bootstrap-admin-password
        volumeMounts:
          - volumeName: keycloak-auth-service-bm0
            mountPath: /opt/keycloak/data/import
    scale:
      minReplicas: 1
tags:
  azd-service-name: keycloak-auth-service
  aspire-resource-name: keycloak-auth-service
