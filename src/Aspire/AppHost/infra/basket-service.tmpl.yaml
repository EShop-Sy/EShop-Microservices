api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: false
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--basketdb
        value: '{{ .Env.POSTGRES_CONNECTIONSTRING }};Database=basketdb'
      - name: connectionstrings--messaging
        value: amqp://{{ uriEncode (securedParameter "RabbitMQUserName" )}}:{{ uriEncode (securedParameter "RabbitMQPassword" )}}@messaging:5672
      - name: messaging-password
        value: '{{ securedParameter "RabbitMQPassword" }}'
      - name: messaging-username
        value: '{{ securedParameter "RabbitMQUserName" }}'
  template:
    containers:
      - image: {{ .Image }}
        name: basket-service
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: BASKETDB_DATABASENAME
            value: basketdb
          - name: BASKETDB_HOST
            value: '{{ .Env.POSTGRES_HOSTNAME }}'
          - name: BASKETDB_JDBCCONNECTIONSTRING
            value: jdbc:postgresql://{{ .Env.POSTGRES_HOSTNAME }}/basketdb?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
          - name: BASKETDB_PORT
            value: "5432"
          - name: BASKETDB_URI
            value: postgresql://{{ .Env.POSTGRES_HOSTNAME }}/basketdb
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: KEYCLOAK_SERVICE_HTTP
            value: http://keycloak-service.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: KEYCLOAK_SERVICE_HTTP_ENDPOINT
            value: http://keycloak-service.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: KEYCLOAK_SERVICE_MANAGEMENT
            value: http://keycloak-service:9000
          - name: MESSAGING_HOST
            value: messaging
          - name: MESSAGING_PORT
            value: "5672"
          - name: MESSAGING_URI
            value: amqp://{{ uriEncode (securedParameter "RabbitMQUserName" )}}:{{ uriEncode (securedParameter "RabbitMQPassword" )}}@messaging:5672
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES
            value: "true"
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES
            value: "true"
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: services__keycloak-service__http-endpoint__0
            value: http://keycloak-service.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__keycloak-service__http__0
            value: http://keycloak-service.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__keycloak-service__management__0
            value: http://keycloak-service:9000
          - name: ConnectionStrings__basketdb
            secretRef: connectionstrings--basketdb
          - name: ConnectionStrings__messaging
            secretRef: connectionstrings--messaging
          - name: MESSAGING_PASSWORD
            secretRef: messaging-password
          - name: MESSAGING_USERNAME
            secretRef: messaging-username
    scale:
      minReplicas: 1
tags:
  azd-service-name: basket-service
  aspire-resource-name: basket-service
