api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: true
      targetPort: 5000
      transport: http
      allowInsecure: false
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
  template:
    containers:
      - image: {{ .Image }}
        name: api-gateway-mobile
        args:
          - /app/yarp.dll
        command: [dotnet]
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_ENVIRONMENT
            value: Development
          - name: BASKET_SERVICE_HTTP
            value: http://basket-service.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: BASKET_SERVICE_HTTPS
            value: https://basket-service.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: KEYCLOAK_SERVICE_HTTP
            value: http://keycloak-service.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: KEYCLOAK_SERVICE_MANAGEMENT
            value: http://keycloak-service:9000
          - name: REVERSEPROXY__CLUSTERS__cluster_basket-service__DESTINATIONS__destination1__ADDRESS
            value: https+http://basket-service
          - name: REVERSEPROXY__CLUSTERS__cluster_keycloak-service__DESTINATIONS__destination1__ADDRESS
            value: http://keycloak-service
          - name: REVERSEPROXY__ROUTES__route0__CLUSTERID
            value: cluster_basket-service
          - name: REVERSEPROXY__ROUTES__route0__MATCH__PATH
            value: /basket/{**catch-all}
          - name: REVERSEPROXY__ROUTES__route0__TRANSFORMS__0__PathPattern
            value: /{**catch-all}
          - name: REVERSEPROXY__ROUTES__route0__TRANSFORMS__1__Action
            value: Set
          - name: REVERSEPROXY__ROUTES__route0__TRANSFORMS__1__ByFormat
            value: Random
          - name: REVERSEPROXY__ROUTES__route0__TRANSFORMS__1__ForFormat
            value: IpAndPort
          - name: REVERSEPROXY__ROUTES__route0__TRANSFORMS__1__Forwarded
            value: For,By,Host,Proto
          - name: REVERSEPROXY__ROUTES__route0__TRANSFORMS__2__Append
            value: YARP
          - name: REVERSEPROXY__ROUTES__route0__TRANSFORMS__2__ResponseHeader
            value: X-Powered-By
          - name: REVERSEPROXY__ROUTES__route0__TRANSFORMS__2__When
            value: Success
          - name: REVERSEPROXY__ROUTES__route1__CLUSTERID
            value: cluster_keycloak-service
          - name: REVERSEPROXY__ROUTES__route1__MATCH__PATH
            value: /keycloak/{**catch-all}
          - name: REVERSEPROXY__ROUTES__route1__TRANSFORMS__0__PathPattern
            value: /{**catch-all}
          - name: REVERSEPROXY__ROUTES__route1__TRANSFORMS__1__Action
            value: Set
          - name: REVERSEPROXY__ROUTES__route1__TRANSFORMS__1__ByFormat
            value: Random
          - name: REVERSEPROXY__ROUTES__route1__TRANSFORMS__1__ForFormat
            value: IpAndPort
          - name: REVERSEPROXY__ROUTES__route1__TRANSFORMS__1__Forwarded
            value: For,By,Host,Proto
          - name: REVERSEPROXY__ROUTES__route1__TRANSFORMS__2__Append
            value: YARP
          - name: REVERSEPROXY__ROUTES__route1__TRANSFORMS__2__ResponseHeader
            value: X-Powered-By
          - name: REVERSEPROXY__ROUTES__route1__TRANSFORMS__2__When
            value: Success
          - name: services__basket-service__http__0
            value: http://basket-service.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__basket-service__https__0
            value: https://basket-service.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__keycloak-service__http__0
            value: http://keycloak-service.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__keycloak-service__management__0
            value: http://keycloak-service:9000
    scale:
      minReplicas: 1
tags:
  azd-service-name: api-gateway-mobile
  aspire-resource-name: api-gateway-mobile
